[project]
name = "all-columns-netflow-poc"
version = "0.1.0"
description = "CPU-only Parquet anomaly comparison across all flow columns"
requires-python = ">=3.11"
dependencies = [
    "joblib>=1.3",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=15.0",
    "PyYAML>=6.0",
    "scikit-learn>=1.4",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["anomaly_poc*"]
